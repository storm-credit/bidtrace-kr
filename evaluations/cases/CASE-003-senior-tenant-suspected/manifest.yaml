      type: auction_commencement
      registration_date: 2026-02-03
  occupants:
    - id: T1
      possession_claim_date: 2020-06-01
      registration_claim_date: 2020-06-02
      fixed_date_claim: 2020-06-02
      deposit_claim: 120000000
      distribution_demand: unknown
  missing_documents:
