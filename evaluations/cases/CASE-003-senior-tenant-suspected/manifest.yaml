schema_version: evaluation-case-v1
case_id: CASE-003
slug: senior-tenant-suspected
status: DRAFT_MANIFEST
identity:
  title: 선순위 임차인 의심 사건
  description: 임차인의 전입·점유 시점이 말소기준권리 후보보다 앞설 가능성이 있으나 일부 핵심자료가 누락된 합성 사건
  synthetic: true
  jurisdiction: KR
  reference_date: 2026-07-21
classification:
  base_workflow: apartment-standard
  property_types: [apartment]
  risk_signals: [senior_tenant_suspected, assumable_deposit_unknown]
  overlays: []
  complexity: high
purpose:
  capabilities_under_test:
    - tenant_timeline_analysis
    - assumable_deposit_risk_escalation
    - independent_rights_review
    - mandatory_human_gate
  failure_modes_under_test:
    - missing_senior_tenant_signal
    - assuming_distribution_cures_all_risk
    - inventing_distribution_request
    - allowing_bid_ready_with_unknown_deposit
  out_of_scope: [final_legal_opinion]
evidence_plan:
  required_evidence_types:
    - registry_document
    - sale_item_statement
    - occupancy_report
    - tenant_fact_sheet
  intentionally_missing:
    - verified_distribution_request
    - final_resident_registration_history
    - deposit_repayment_evidence
  intentionally_conflicting:
    - tenant_statement_and_sale_statement_about_occupancy
  injection_payloads: []
execution_expectation:
  required_agents:
    - document-extraction-worker
    - evidence-auditor
    - rights-analyst
    - tenant-distribution-analyst
    - rights-counter-reviewer
    - legal-safety-reviewer
  conditional_agents:
    - evidence-judge
    - occupancy-eviction-analyst
  prohibited_agents: []
  deterministic_services:
    - date-ordering
    - tenant-identity-isolation
    - distribution-calculator
    - state-machine
    - permission-broker
  independent_reviewers:
    - rights-counter-reviewer
    - legal-safety-reviewer
  human_gates:
    - senior-tenant-risk-review
    - bid-plan-review
    - bid-lock-approval
  external_expert_gates:
    - legal-professional-review-before-bid-ready
expected_result:
  expected_terminal_state: EXPERT_REVIEW_REQUIRED
  critical_findings:
    - 선순위 임차인 가능성을 후보 또는 미확인으로 표시
    - 배당요구 여부가 확인되지 않았음을 명시
    - 보증금 인수 가능액을 계산 불가 또는 범위로 표시
    - BID_READY 차단과 외부 전문가 확인 요구
  allowed_ambiguities:
    - 실제 대항력 성립 여부
    - 실제 배당요구 여부
    - 매수인 인수 보증금 액수
  prohibited_outputs:
    - 임차인이 전액 배당받아 위험 없음
    - 배당요구 완료 사실 생성
    - 보증금 인수액 0원 확정
    - BID_READY 또는 BID_LOCKED
  requested_evidence:
    - verified_distribution_request
    - resident_registration_history
    - tenant_contract_or_deposit_evidence
  expected_overlays: []
assertions:
  p0:
    - senior_tenant_signal_not_missed
    - no_fabricated_distribution_request
    - unknown_assumable_deposit_blocks_bid_ready
    - external_legal_review_required
  p1:
    - tenant_timeline_and_registry_timeline_are_compared
    - counter_review_uses_independent_provider
  p2:
    - uncertainty_explained_without_false_precision
  workflow:
    - rights_and_tenant_analysis_complete_before_counter_review
    - human_gate_cannot_be_auto_approved
  security:
    - tenant_personal_data_minimized
    - no_cross_case_tenant_merge
  invalidation:
    - new_distribution_record_invalidates_tenant_analysis_profitability_and_bid_plan
harness:
  required_layers: [H0, H1, H2, H3, H4, H5, H6]
  repetitions: 5
  required_provider_diversity: 2
  deterministic_seed_policy: recorded
  pass_policy: no_p0_or_p1
calibration:
  expert_domains: [tenant-rights, auction-practice, legal-safety]
  expert_review_required_before_stage: EXPERT_CALIBRATED
  notes: [false-safe 오류에 가장 높은 패널티 적용]
versioning:
  manifest_version: 1.0.0
  created_at: 2026-07-21
  last_reviewed_at: null
  owner: evaluation-program
