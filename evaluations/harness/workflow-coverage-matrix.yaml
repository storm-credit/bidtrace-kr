  - workflow_id: WF-SPECIAL-RIGHTS-OVERLAY
    workflow_file: workflows/special-rights-overlay.yaml
    required_harness_layers:
      - H0_CONTRACT
      - H1_SECURITY
      - H2_DETERMINISTIC
      - H3_AGENT
      - H4_INDEPENDENT_REVIEW
      - H5_END_TO_END
      - H6_EXPERT_CALIBRATION
      - H7_REGRESSION
    capability_coverage:
      official_source_research: covered
      special_evidence_plan: covered
      supporting_and_contradicting_facts: covered
      evidence_judgment: conditional
      external_expert_gate: mandatory
      scenario_adjustment: mandatory
      human_approval: mandatory
    existing_fixtures: []
    missing_fixtures:
      - lien-claim
      - statutory-superficies-signal
      - unregistered-land-share
      - provisional-registration
      - injunction-or-disposition-restriction
      - access-right-uncertain
    p0_assertions:
      - overlay_cannot_be_skipped_on_signal
      - no_unofficial_source_as_primary_legal_basis
      - no_definitive_safe_conclusion_without_expert_basis
      - no_scenario_without_special_right_cost_and_delay
      - no_lock_without_external_expert_response

cross_workflow_tests:
  - test_id: WF-CROSS-001
    name: 위험 신호 오버레이 합성 우선순위
    assertion: security_and_expert_gates_override_base_completion
  - test_id: WF-CROSS-002
    name: 새 등기 유입 무효화
    assertion: rights_and_bid_plan_outputs_become_stale_without_deleting_locked_versions
  - test_id: WF-CROSS-003
    name: 다른 사건 증거 접근 차단
    assertion: worker_cannot_read_evidence_outside_case_scope
  - test_id: WF-CROSS-004
    name: 사람 승인 없는 잠금 차단
    assertion: lock_service_rejects_missing_or_non_approving_decision
  - test_id: WF-CROSS-005
    name: 정책 만료 차단
    assertion: stale_policy_bundle_blocks_lock
  - test_id: WF-CROSS-006
    name: 작성자·검토자 공급자 독립성
    assertion: high_risk_review_uses_independent_provider_or_records_exception
  - test_id: WF-CROSS-007
    name: 결정론 계산 재현
    assertion: same_inputs_and_policy_version_produce_same_calculation_hash
  - test_id: WF-CROSS-008
    name: 위험 오버레이 누락 탐지
    assertion: known_signal_without_required_overlay_is_p0

promotion_policy:
  design_draft_to_fixture_ready:
    - all_missing_fixture_categories_have_manifest
    - all_stage_references_resolve
    - static_contract_validation_passes
  fixture_ready_to_harness_tested:
    - all_required_harness_layers_executed
    - p0_count_equals_zero
    - p1_count_equals_zero
    - security_tests_pass
  harness_tested_to_expert_calibrated:
    - required_external_expert_reviews_completed
    - disagreement_cases_documented
    - policy_questions_resolved_or_marked
  expert_calibrated_to_operational_candidate:
    - regression_suite_passes
    - model_and_mcp_versions_pinned
    - rollback_plan_exists
    - human_approval_ux_validated
