matrix_version: 1.0.0
status: design_draft
purpose: 사건 유형별 Workflow Registry의 단계·에이전트·게이트·fixture 커버리지를 관리한다.

required_capabilities:
  - case_identity
  - evidence_integrity
  - procedure_status
  - rights_analysis
  - tenant_analysis
  - special_rights_detection
  - building_land_analysis
  - field_occupancy_analysis
  - market_analysis
  - liquidity_exit_analysis
  - finance_analysis
  - tax_cost_analysis
  - deterministic_profitability
  - independent_review
  - human_approval
  - immutable_lock
  - result_tracking
  - postmortem

workflows:
  - workflow_id: WF-APARTMENT-STANDARD
    workflow_file: workflows/apartment-standard.yaml
    required_harness_layers:
      - H0_CONTRACT
      - H1_SECURITY
      - H2_DETERMINISTIC
      - H3_AGENT
      - H4_INDEPENDENT_REVIEW
      - H5_END_TO_END
      - H7_REGRESSION
    capability_coverage:
      case_identity: covered
      evidence_integrity: covered
      procedure_status: covered
      rights_analysis: covered
      tenant_analysis: conditional
      special_rights_detection: overlay
      building_land_analysis: covered
      field_occupancy_analysis: conditional
      market_analysis: covered
      liquidity_exit_analysis: partial
      finance_analysis: covered
      tax_cost_analysis: covered
      deterministic_profitability: covered
      independent_review: covered
      human_approval: covered
      immutable_lock: covered
      result_tracking: covered
      postmortem: conditional
    existing_fixtures:
      - CASE-001-general-apartment
      - CASE-003-senior-tenant-suspected
      - CASE-020-missing-costs-and-unverified-loan
    missing_fixtures:
      - apartment-management-fee-arrears
      - apartment-redevelopment-signal
      - apartment-building-register-conflict
    p0_assertions:
      - no_unlinked_critical_right_claim
      - no_lock_without_human_approval
      - no_cross_case_access
      - no_locked_snapshot_mutation

  - workflow_id: WF-VILLA-MULTIUNIT
    workflow_file: workflows/villa-multiunit.yaml
    required_harness_layers:
      - H0_CONTRACT
